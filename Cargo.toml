[workspace]
members = ["shared", "tauri/src-tauri"]
resolver = "3"

[workspace.package]
authors = ["Andrea C"]
edition = "2024"
repository = "https://codeberg.org/andreacfromtheapp/elm_tauri_crux_template"
license = "Apache-2.0"
keywords = ["elm", "tauri", "crux", "applications", "elmlang", "rustlang"]
rust-version = "1.90"
description = "Simple counter template for applications in Elm + Tauri + Crux."
homepage = "https://codeberg.org/andreacfromtheapp/elm_tauri_crux_template"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
empty_docs = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1.0.103"
crux_core = "0.19"
serde = "1.0.228"
